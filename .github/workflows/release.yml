name: Build Raspberry Pi Release

on:
  push:
    branches:
      - main
    paths:
      - 'src/**/*.rs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
      ARTIFACT_NAME: prosthesis-communication-bridge-linux-aarch64
      BINARY_NAME: prosthesis-communication-bridge
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      # 1. Install Zig toolchain natively on the runner
      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2

      # 2. Install cargo-zigbuild tool 
      - name: Install cargo-zigbuild
        run: cargo install cargo-zigbuild

      # 3. Compile seamlessly via zigbuild!
      # Zig automatically links and sets up the correct headers for the musl universe
      - name: Build release binary
        run: cargo zigbuild --release --target "${TARGET}"

      - name: Package release asset
        run: |
          set -eu
          staging_dir="$(mktemp -d)"
          install -m 755 "target/${TARGET}/release/${BINARY_NAME}" "${staging_dir}/${BINARY_NAME}"
          tar -C "${staging_dir}" -czf "${ARTIFACT_NAME}.tar.gz" "${BINARY_NAME}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: build-${{ github.run_number }}
          generate_release_notes: true
          files: |
            prosthesis-communication-bridge-linux-aarch64.tar.gz
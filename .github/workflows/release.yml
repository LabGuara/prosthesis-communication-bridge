name: Build Raspberry Pi Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TARGET: aarch64-unknown-linux-musl
      ARTIFACT_NAME: prothesis-logger-wrapper-linux-aarch64
      BINARY_NAME: prothesis-logger-wrapper
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      # 1. Install the Cross compilation engine
      - name: Install Cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      # 2. Build using cross instead of cargo. 
      # This completely isolates the C toolchain inside Docker.
      - name: Build release binary
        run: cross build --release --target "${TARGET}"

      - name: Package release asset
        run: |
          set -eu
          staging_dir="$(mktemp -d)"
          install -m 755 "target/${TARGET}/release/${BINARY_NAME}" "${staging_dir}/${BINARY_NAME}"
          tar -C "${staging_dir}" -czf "${ARTIFACT_NAME}.tar.gz" "${BINARY_NAME}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: build-${{ github.run_number }}
          generate_release_notes: true
          files: |
            prothesis-logger-wrapper-linux-aarch64.tar.gz